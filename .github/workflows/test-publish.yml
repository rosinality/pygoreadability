name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected version (informational; not enforced)"
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            archs_linux: x86_64
            go_tgz_arch: amd64
          - os: ubuntu-22.04-arm
            archs_linux: aarch64
            go_tgz_arch: arm64
          - os: macos-14
            archs_macos: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Go (macOS)
        if: runner.os == 'macOS'
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.0"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.19.2
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-*"
          CIBW_SKIP: "pp*"
          CIBW_ARCHS_MACOS: "${{ matrix.archs_macos }}"
          CIBW_ARCHS_LINUX: "${{ matrix.archs_linux }}"
          CIBW_OUTPUT_DIR: "wheelhouse"
          CIBW_ENVIRONMENT_MACOS: "GOREADABILITY_VERSION="
          CIBW_BEFORE_ALL_LINUX: >-
            curl -sSL https://go.dev/dl/go1.23.0.linux-${{ matrix.go_tgz_arch }}.tar.gz -o /tmp/go.tgz
            && rm -rf /usr/local/go
            && tar -C /usr/local -xzf /tmp/go.tgz
          CIBW_ENVIRONMENT_LINUX: "PATH=/usr/local/go/bin:$PATH GOREADABILITY_VERSION="
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: "pytest -q {project}/tests"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install -U build
          python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    runs-on: ubuntu-22.04
    needs: [build, sdist]
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
